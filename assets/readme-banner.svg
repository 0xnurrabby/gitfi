<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="title desc">
  <title id="title">GitFi.fun - The market layer for open source</title>
  <desc id="desc">A light architectural paper banner with the GitFi.fun wordmark, the headline The market layer for open source, feature chips, and an on-chain market chart.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f45d" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#c9f45d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chartfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fca1e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9fca1e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#101510" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#101510" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="#f4f1e7"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <circle cx="1440" cy="30" r="360" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(76 58)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#101510"/>
    <path d="M23 8 36 15.5v15L23 38 10 30.5v-15L23 8Z" fill="none" stroke="#c9f45d" stroke-width="2"/>
    <path d="M23 16v12M16 20v4M30 20v4" fill="none" stroke="#c9f45d" stroke-width="2" stroke-linecap="round"/>
    <text x="61" y="29" font-family="Geist, Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#101510" letter-spacing="-0.8">GitFi.fun</text>
    <text x="61" y="44" font-family="'Geist Mono', 'SFMono-Regular', Consolas, monospace" font-size="10" fill="#626b5e" letter-spacing="1.8">DOCS  /  TESTNET</text>
  </g>

  <!-- editorial marker -->
  <g transform="translate(76 156)">
    <path d="M0 0H34" stroke="#5f7f0a" stroke-width="2"/>
    <text x="46" y="4" font-family="'Geist Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#5f7f0a" letter-spacing="2.6">THE MARKET LAYER FOR OPEN SOURCE</text>
  </g>

  <!-- headline -->
  <text x="72" y="276" font-family="Geist, Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="540" fill="#101510" letter-spacing="-6">The market layer</text>
  <text x="72" y="366" font-family="Geist, Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="540" fill="#5f7f0a" letter-spacing="-6">for open source.</text>

  <!-- subcopy -->
  <text x="76" y="419" font-family="Geist, Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5449">Verified GitHub repositories become real on-chain markets on NEAR.</text>
  <text x="76" y="446" font-family="Geist, Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5449">Own the work. Price the work. Let the market discover the work.</text>

  <!-- feature chips -->
  <g font-family="'Geist Mono', 'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="0.9">
    <g transform="translate(76 486)">
      <rect width="131" height="30" rx="15" fill="#ffffff" stroke="#101510" stroke-opacity="0.16"/>
      <circle cx="17" cy="15" r="3.5" fill="#177a4b"/>
      <text x="29" y="19" fill="#2f362d">NEAR TESTNET</text>
    </g>
    <g transform="translate(216 486)">
      <rect width="142" height="30" rx="15" fill="#ffffff" stroke="#101510" stroke-opacity="0.16"/>
      <text x="16" y="19" fill="#2f362d">1 REPO = 1 TOKEN</text>
    </g>
    <g transform="translate(367 486)">
      <rect width="142" height="30" rx="15" fill="#ffffff" stroke="#101510" stroke-opacity="0.16"/>
      <text x="16" y="19" fill="#2f362d">README PROOF</text>
    </g>
    <g transform="translate(518 486)">
      <rect width="118" height="30" rx="15" fill="#c9f45d" stroke="#c9f45d"/>
      <text x="16" y="19" fill="#101510">1.3% FEE</text>
    </g>
  </g>

  <!-- terminal card -->
  <g transform="translate(962 96)" filter="url(#shadow)">
    <rect width="562" height="384" rx="20" fill="#fbfaf5" stroke="#101510" stroke-opacity="0.14"/>
    <path d="M0 20h562" stroke="#101510" stroke-opacity="0.08"/>
    <circle cx="24" cy="20" r="3.4" fill="#5f7f0a"/>
    <circle cx="36" cy="20" r="3.4" fill="#d8d3c2"/>
    <circle cx="48" cy="20" r="3.4" fill="#d8d3c2"/>
    <text x="68" y="24" font-family="'Geist Mono', 'SFMono-Regular', Consolas, monospace" font-size="9" fill="#8d9588">gitfi://markets/your-repo</text>
    <g transform="translate(478 13)">
      <circle cx="3" cy="7" r="2.6" fill="#177a4b"/>
      <text x="11" y="10" font-family="'Geist Mono', 'SFMono-Regular', Consolas, monospace" font-size="7" fill="#177a4b" letter-spacing="1">ON-CHAIN</text>
    </g>

    <g transform="translate(26 48)">
      <rect width="42" height="42" rx="8" fill="#101510"/>
      <text x="21" y="27" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" fill="#c9f45d" font-weight="700">GF</text>
      <text x="56" y="18" font-family="'Geist Mono', monospace" font-size="16" fill="#101510" font-weight="700">$YOURREPO</text>
      <text x="56" y="34" font-family="'Geist Mono', monospace" font-size="9" fill="#8d9588">builder/your-repo</text>
      <g transform="translate(352 7)">
        <rect width="75" height="21" rx="4" fill="none" stroke="#177a4b" stroke-opacity="0.35"/>
        <text x="37" y="14" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#177a4b" letter-spacing="0.8">VERIFIED</text>
      </g>
    </g>

    <text x="26" y="132" font-family="'Geist Mono', monospace" font-size="26" fill="#101510" font-weight="600" letter-spacing="-1.2">$0.000066</text>
    <text x="172" y="130" font-family="'Geist Mono', monospace" font-size="9" fill="#177a4b">LIVE USD</text>

    <g transform="translate(26 148)">
      <path d="M0 122 C42 120 70 112 104 108 C142 103 166 110 206 91 C247 72 270 80 312 61 C355 42 382 48 420 33 C445 24 470 19 510 12 L510 135 L0 135 Z" fill="url(#chartfill)"/>
      <path d="M0 122 C42 120 70 112 104 108 C142 103 166 110 206 91 C247 72 270 80 312 61 C355 42 382 48 420 33 C445 24 470 19 510 12" fill="none" stroke="#7c9c11" stroke-width="2.4"/>
      <circle cx="510" cy="12" r="4.6" fill="#7c9c11"/>
      <g stroke="#101510" stroke-opacity="0.08">
        <path d="M0 34h510M0 68h510M0 102h510"/>
      </g>
    </g>

    <g transform="translate(26 302)">
      <path d="M0 0h510" stroke="#101510" stroke-opacity="0.1"/>
      <text x="0" y="22" font-family="'Geist Mono', monospace" font-size="7" fill="#8d9588" letter-spacing="1.1">MARKET CAP</text>
      <text x="0" y="42" font-family="'Geist Mono', monospace" font-size="13" fill="#101510">$64.2K</text>
      <text x="176" y="22" font-family="'Geist Mono', monospace" font-size="7" fill="#8d9588" letter-spacing="1.1">24H VOLUME</text>
      <text x="176" y="42" font-family="'Geist Mono', monospace" font-size="13" fill="#101510">$3.40</text>
      <text x="352" y="22" font-family="'Geist Mono', monospace" font-size="7" fill="#8d9588" letter-spacing="1.1">HOLDERS</text>
      <text x="352" y="42" font-family="'Geist Mono', monospace" font-size="13" fill="#101510">1</text>
    </g>

    <text x="26" y="368" font-family="'Geist Mono', monospace" font-size="7" fill="#a2a99a" letter-spacing="1">PRICES FROM THE MARKET CONTRACT  /  USD VIA LIVE NEAR QUOTE</text>
  </g>
</svg>
