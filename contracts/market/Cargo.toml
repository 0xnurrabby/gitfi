[package]
name = "gitfi-market"
version = "1.0.0"
description = "Real NEAR-quoted GitFi repo markets"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.6.0", features = ["legacy"] }
borsh = { version = "1.8.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.6.0", features = ["legacy", "unit-testing"] }