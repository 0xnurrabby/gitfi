[package]
name = "gitfi-repo-registry"
version = "1.0.0"
description = "One repo. One Repo NFT. One oracle-verified deed."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.6.0", features = ["legacy"] }
borsh = { version = "1.8.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.6.0", features = ["legacy", "unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }